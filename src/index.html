<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Relay Dashboard</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .connected { color: green; }
        .disconnected { color: red; }
        #messages { border: 1px solid #ddd; padding: 10px; height: 200px; overflow-y: scroll; max-width: 600px; margin-top: 20px; }
        .input-group { margin-bottom: 10px; }
        input { padding: 8px; margin-right: 5px; }
    </style>
</head>
<body>
    <h1>Phone Relay Dashboard</h1>
    <p>Status: <span id="status" class="disconnected">Disconnected</span></p>
    
    <!-- UPDATED: Added a target device ID input -->
    <div class="input-group">
        <input type="text" id="deviceIdInput" placeholder="Target Device ID (e.g. Phone_A)" style="width: 180px;">
        <input type="text" id="commandInput" placeholder="Command (e.g. toggle_flash)" style="width: 250px;">
        <button id="sendBtn">Send Command</button>
    </div>

    <div id="messages"></div>

    <script>
        const statusEl = document.getElementById('status');
        const messagesEl = document.getElementById('messages');
        const deviceIdInput = document.getElementById('deviceIdInput');
        const commandInput = document.getElementById('commandInput');
        const sendBtn = document.getElementById('sendBtn');

        // Determine WebSocket protocol based on page protocol
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/dash`;

        const ws = new WebSocket(wsUrl);

        ws.onopen = () => {
            statusEl.textContent = 'Connected';
            statusEl.className = 'connected';
            addMessage('Connected to Relay Server');
        };

        ws.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                // UPDATED: If the server sends back a deviceId (like phone responses), we show it
                if (data.deviceId) {
                    addMessage(`📱 ${data.deviceId}: ${JSON.stringify(data.data)}`);
                } else {
                    addMessage(`Server: ${JSON.stringify(data)}`);
                }
            } catch (e) {
                addMessage(`Received: ${event.data}`);
            }
        };

        ws.onclose = () => {
            statusEl.textContent = 'Disconnected';
            statusEl.className = 'disconnected';
            addMessage('Disconnected from server');
        };

        function addMessage(text) {
            const p = document.createElement('p');
            p.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
            messagesEl.appendChild(p);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        // UPDATED: The send button now packages the command with the targetDeviceId
        sendBtn.onclick = () => {
            const deviceId = deviceIdInput.value.trim();
            const cmd = commandInput.value.trim();
            
            if (!deviceId) {
                alert('Please enter a Target Device ID (e.g. Phone_A)');
                return;
            }

            if (cmd && ws.readyState === WebSocket.OPEN) {
                // Format the message exactly how the server expects it
                const payload = JSON.stringify({ 
                    targetDeviceId: deviceId, 
                    command: cmd 
                });
                
                ws.send(payload);
                addMessage(`Sent to ${deviceId}: ${cmd}`);
                
                // Clear the command input (keep the device ID for next time)
                commandInput.value = '';
            } else {
                alert('Not connected or empty command');
            }
        };
    </script>
</body>
</html>
